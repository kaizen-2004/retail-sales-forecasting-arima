# Sales Forecasting Configuration

# Data paths
data:
  raw_dir: data/raw
  processed_dir: data/processed
  database_dir: data/database
  source_file: Online Retail.xlsx

# Database settings
database:
  name: sales_forecasting.db
  type: sqlite

# Processing settings
processing:
  min_quantity: 1
  min_price: 0.01
  remove_cancelled: true
  remove_missing_customer: true

# Forecasting settings
forecasting:
  target_column: total_sales
  date_column: Date
  forecast_horizon: 30  # days
  train_test_split: 0.8

# Visualization settings
visualization:
  figure_size: [12, 6]
  style: seaborn-v0_8
  dpi: 100
  save_figures: true
  output_dir: reports/figures
