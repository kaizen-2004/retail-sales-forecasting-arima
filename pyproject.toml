[project]
name = "sales-forecasting"
version = "0.1.0"
description = "Retail sales forecasting using Python, Pandas, NumPy, Matplotlib, Statsmodels, and SQL"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "sqlalchemy>=1.4.0",
    "statsmodels>=0.13.0",
    "scikit-learn>=1.1.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "plotly>=5.10.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.15.0",
    "pytest>=7.1.0",
    "pytest-cov>=3.0.0",
    "python-dotenv>=0.20.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
